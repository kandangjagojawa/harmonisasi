<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panduan Pengetikan: Harmonisasi Tata Tulis Aksara Jawa</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Javanese:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Import Font Lokal */
        @font-face {
            font-family: 'NgayogyanN';
            src: url('ngayogyann.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Ngayogyan';
            src: url('ngayogyan.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Charis';
            src: url('charis.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Gentium';
            src: url('gentium.ttf') format('truetype');
        }

        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-header: #1e293b;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #d97706;
            --aksara-color: #1e3a8a;
            --table-hover: #f1f5f9;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-header: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --primary-light: #1e293b;
            --accent: #f59e0b;
            --aksara-color: #60a5fa;
            --table-hover: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.2s, border-color 0.2s; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 24px;
            line-height: 1.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header Section */
        header {
            background: var(--bg-card);
            padding: 24px 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-title h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        .btn:hover {
            background: var(--table-hover);
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            color: #ffffff;
        }

        /* Playground disembunyikan sepenuhnya via CSS */
        .playground-hidden,
        #playgroundSection,
        .tab-playground {
            display: none !important;
        }

        /* Controls Section */
        .controls-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 260px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-body);
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
        }

        select, input[type="range"] {
            padding: 8px 12px;
            font-size: 0.875rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--primary);
        }

        /* Multiselect Dropdown */
        .dropdown-check-list {
            position: relative;
            display: inline-block;
        }

        .dropdown-check-list .anchor {
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 0.875rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown-check-list ul.items {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            padding: 10px;
            z-index: 100;
            min-width: 200px;
            list-style: none;
        }

        .dropdown-check-list.visible ul.items {
            display: block;
        }

        .dropdown-check-list ul.items li {
            padding: 6px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px;
        }

        .dropdown-check-list ul.items li:hover {
            background: var(--table-hover);
        }

        /* Table & Container */
        .table-wrapper {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            font-size: 0.85rem !important;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background-color: var(--bg-header);
            color: #ffffff !important;
            padding: 14px 16px;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tr:hover td {
            background-color: var(--table-hover);
        }

        .code {
            font-family: 'Courier New', Courier, monospace;
            background: var(--primary-light);
            color: var(--primary);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(37, 99, 235, 0.2);
            cursor: pointer;
            display: inline-block;
        }

        .code:hover {
            background: var(--primary);
            color: #fff;
        }

        .section-row td {
            background-color: var(--table-hover);
            font-weight: 700;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            padding: 10px;
            text-transform: uppercase;
        }

        .dash {
            color: var(--text-muted);
            opacity: 0.5;
        }

        /* Font Styling per Column - General Rules for Table and Grid Card */
        .font-default .col-sriwedari, 
        .font-default .col-simplified { 
            font-family: 'NgayogyanN', 'Noto Sans Javanese', sans-serif; 
            font-size: 1.6rem; 
            color: var(--aksara-color); 
            line-height: 1.4;
            cursor: pointer;
        }

        .font-default .col-kawi, 
        .font-default .col-tradisional { 
            font-family: 'Ngayogyan', 'Noto Sans Javanese', sans-serif; 
            font-size: 1.6rem; 
            color: var(--aksara-color); 
            line-height: 1.4;
            cursor: pointer;
        }

        .col-ipa { 
            font-family: 'Charis', sans-serif; 
            font-size: 1.15rem; 
            color: var(--text-main);
            font-weight: 400;
        }

        .col-jgst { 
            font-family: 'Gentium', serif; 
            color: var(--accent); 
            font-size: 1.15rem; 
            font-weight: 400;
        }

        /* Font Noto Mode */
        .font-noto .col-sriwedari, 
        .font-noto .col-simplified, 
        .font-noto .col-kawi, 
        .font-noto .col-tradisional, 
        .font-noto .col-ipa, 
        .font-noto .col-jgst { 
            font-family: 'Noto Sans Javanese', sans-serif !important; 
            font-size: 1.4rem; 
            color: var(--aksara-color); 
            line-height: 1.4;
            cursor: pointer;
        }

        /* Class Sembunyi Kolom */
        .col-hidden { display: none !important; }

        /* Copy Toast Notification */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg-header);
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Grid View Mode */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            padding: 4px;
        }

        .aksara-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .aksara-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .card-latin {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            align-items: start;
        }

        .card-aksara-main {
            font-size: 2.2rem !important;
            color: var(--aksara-color);
            text-align: center;
            grid-column: span 2;
            padding: 10px 0;
            background: var(--bg-body);
            border-radius: 8px;
        }

        .card-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* Label Teks Latin Kartu Grid: Noto Sans, Ukuran diperkecil 30% (~0.7rem) */
        .card-meta-label {
            font-family: 'Noto Sans', sans-serif !important;
            font-size: 0.7rem !important;
            font-weight: 600;
            color: var(--text-muted);
            line-height: 1.2;
            text-transform: none;
        }

        /* Tampilan Nilai di Bawah Label Kartu Grid: Font Weight Reguler (400) */
        .card-meta span {
            display: inline-block;
            color: var(--text-main);
            font-weight: 400 !important;
            word-break: break-word;
        }
    </style>
</head>
<body class="font-default">

    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-title">
                <h1>
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    Harmonisasi Tata Tulis Aksara Jawa
                </h1>
                <p>Panduan Pengetikan, Komparasi Paugeran, Fonetik IPA & JGST</p>
            </div>
            <div class="header-actions">
                <button class="btn" onclick="toggleTheme()" id="themeBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    Mode Gelap
                </button>
            </div>
        </header>

        <!-- Controls Card -->
        <div class="controls-card">
            <div class="controls-row">
                <!-- Search Box -->
                <div class="search-box">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="text" id="searchInput" placeholder="Cari Input Latin, Aksara, IPA, JGST, Kode..." oninput="renderData()">
                </div>

                <!-- Preset View -->
                <div class="control-group">
                    <label for="presetView">Preset View:</label>
                    <select id="presetView" onchange="applyPresetView(this.value)">
                        <option value="all">View Semua</option>
                        <option value="jawa">View Aksara Jawa</option>
                        <option value="ipa_jgst">View IPA & JGST</option>
                        <option value="jawa_baru">View Jawa Baru</option>
                        <option value="jawa_kuno">View Jawa Kuno</option>
                    </select>
                </div>

                <!-- Filter Kolom Individual -->
                <div class="control-group">
                    <label>Filter Kolom:</label>
                    <div id="listColToggle" class="dropdown-check-list">
                        <span class="anchor" onclick="toggleDropdownList()">Pilih Kolom &#9662;</span>
                        <ul class="items">
                            <li><input type="checkbox" checked disabled /> <label style="color:var(--text-muted);">Input Latin</label></li>
                            <li><input type="checkbox" id="chk_sriwedari" checked onchange="toggleColumnVisibility('col-sriwedari', this.checked)" /> <label for="chk_sriwedari">Sriwedari/KBJ</label></li>
                            <li><input type="checkbox" id="chk_simplified" checked onchange="toggleColumnVisibility('col-simplified', this.checked)" /> <label for="chk_simplified">Simplified</label></li>
                            <li><input type="checkbox" id="chk_kawi" checked onchange="toggleColumnVisibility('col-kawi', this.checked)" /> <label for="chk_kawi">Cara Kawi</label></li>
                            <li><input type="checkbox" id="chk_tradisional" checked onchange="toggleColumnVisibility('col-tradisional', this.checked)" /> <label for="chk_tradisional">Tradisional</label></li>
                            <li><input type="checkbox" id="chk_unicode" checked onchange="toggleColumnVisibility('col-unicode', this.checked)" /> <label for="chk_unicode">Unicode</label></li>
                            <li><input type="checkbox" id="chk_ipa" checked onchange="toggleColumnVisibility('col-ipa', this.checked)" /> <label for="chk_ipa">IPA</label></li>
                            <li><input type="checkbox" id="chk_jgst" checked onchange="toggleColumnVisibility('col-jgst', this.checked)" /> <label for="chk_jgst">JGST</label></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="controls-row">
                <!-- Urutan Sort (Default: Warga Aksara Kawi) -->
                <div class="control-group">
                    <label for="sortOrder">Urutan:</label>
                    <select id="sortOrder" onchange="renderData()">
                        <option value="kawi" selected>Warga Aksara (Kawi)</option>
                        <option value="kategori">Berdasarkan Kategori</option>
                        <option value="alphabet">Alfabet Latin (A-Z)</option>
                        <option value="hanacaraka">Urutan Hanacaraka</option>
                        <option value="unicode">Kode Unicode</option>
                    </select>
                </div>

                <!-- Font Mode Dropdown -->
                <div class="control-group">
                    <label for="fontSelect">Font Mode:</label>
                    <select id="fontSelect" onchange="updateFontMode()">
                        <option value="font-default">Font Default</option>
                        <option value="font-noto">Noto Sans Javanese</option>
                    </select>
                </div>

                <!-- Slider Ukuran IPA & JGST -->
                <div class="control-group">
                    <label for="diacriticsSize">Ukuran IPA/JGST:</label>
                    <input type="range" id="diacriticsSize" min="1.0" max="2.0" step="0.05" value="1.25" oninput="updateDiacriticsSize(this.value)">
                </div>

                <!-- Toggle Layout View Mode -->
                <div class="control-group" style="margin-left: auto;">
                    <button class="btn" onclick="toggleLayoutView('table')" id="btnTableView">Tabel</button>
                    <button class="btn" onclick="toggleLayoutView('grid')" id="btnGridView">Kartu Grid</button>
                </div>
            </div>
        </div>

        <!-- Playground Section (Tersembunyi - Tidak Dihapus) -->
        <div id="playgroundSection" class="playground-hidden">
            <h2>Area Uji Coba / Playground Transliterasi</h2>
            <textarea id="playgroundInput" placeholder="Ketik teks latin di sini..."></textarea>
            <div id="playgroundOutput"></div>
        </div>

        <!-- Main Display Container (Table View) -->
        <div id="tableViewWrapper" class="table-wrapper" style="display: none;">
            <table id="mappingTable">
                <thead>
                    <tr>
                        <th class="col-latin">Input Latin</th>
                        <th class="col-sriwedari">Sriwedari / KBJ</th>
                        <th class="col-simplified">Simplified</th>
                        <th class="col-kawi">Cara Kawi</th>
                        <th class="col-tradisional">Tradisional</th>
                        <th class="col-unicode">Unicode</th>
                        <th class="col-ipa">IPA</th>
                        <th class="col-jgst">JGST</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Content dynamic rendering -->
                </tbody>
            </table>
        </div>

        <!-- Alternative Display Container (Grid Card View - DEFAULT) -->
        <div id="gridViewWrapper" class="grid-container">
            <!-- Content dynamic grid cards -->
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
        <span id="toastMsg">Teks berhasil disalin!</span>
    </div>

    <script>
        const aksaraData = [
            // AKSARA WYANJANA (NGLEGENA)
            { cat: 'Wyanjana', id: 'h', lat: 'h', kbj: 'ꦲ', simp: 'ꦲ', mk: 'ꦲ', trad: 'ꦲ', uni: 'U+A9B2', ipa: '/h/ atau /a/', jgst: 'h', hana: 1, warga: 6 },
            { cat: 'Wyanjana', id: 'n', lat: 'n', kbj: 'ꦤ', simp: 'ꦤ', mk: 'ꦤ', trad: 'ꦤ', uni: 'U+A9A4', ipa: '/n/', jgst: 'n', hana: 2, warga: 24 },
            { cat: 'Wyanjana', id: 'c', lat: 'c', kbj: 'ꦕ', simp: 'ꦕ', mk: 'ꦕ', trad: 'ꦕ', uni: 'U+A995', ipa: '/tʃ/', jgst: 'c', hana: 3, warga: 7 },
            { cat: 'Wyanjana', id: 'r', lat: 'r', kbj: 'ꦫ', simp: 'ꦫ', mk: 'ꦫ', trad: 'ꦫ', uni: 'U+A9AB', ipa: '/r/', jgst: 'r', hana: 4, warga: 18 },
            { cat: 'Wyanjana', id: 'k', lat: 'k', kbj: 'ꦏ', simp: 'ꦏ', mk: 'ꦏ', trad: 'ꦏ', uni: 'U+A98F', ipa: '/k/', jgst: 'k', hana: 5, warga: 1 },
            { cat: 'Wyanjana', id: 'd', lat: 'd', kbj: 'ꦢ', simp: 'ꦢ', mk: 'ꦢ', trad: 'ꦢ', uni: 'U+A9A2', ipa: '/d/', jgst: 'd', hana: 6, warga: 22 },
            { cat: 'Wyanjana', id: 't', lat: 't', kbj: 'ꦠ', simp: 'ꦠ', mk: 'ꦠ', trad: 'ꦠ', uni: 'U+A9A0', ipa: '/t/', jgst: 't', hana: 7, warga: 20 },
            { cat: 'Wyanjana', id: 's', lat: 's', kbj: 'ꦱ', simp: 'ꦱ', mk: 'ꦱ', trad: 'ꦱ', uni: 'U+A9B1', ipa: '/s/', jgst: 's', hana: 8, warga: 26 },
            { cat: 'Wyanjana', id: 'w', lat: 'w', kbj: 'ꦮ', simp: 'ꦮ', mk: 'ꦮ', trad: 'ꦮ', uni: 'U+A9AE', ipa: '/w/', jgst: 'w', hana: 9, warga: 32 },

        let currentLayoutView = 'grid';

        function formatVal(val) {
            return val === '-' ? '<span class="dash">-</span>' : `<span onclick="copyText('${val}')" title="Klik untuk salin">${val}</span>`;
        }

        function extractUnicodeValue(uniStr) {
            const match = uniStr.match(/U\+([0-9A-Fa-f]{4})/);
            return match ? parseInt(match[1], 16) : 0xFFFFFF;
        }

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            const themeBtn = document.getElementById('themeBtn');
            themeBtn.innerHTML = newTheme === 'dark' 
                ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg> Mode Terang`
                : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> Mode Gelap`;
        }

        function copyText(text) {
            if (text === '-') return;
            navigator.clipboard.writeText(text).then(() => {
                showToast(`Berhasil disalin: "${text}"`);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function updateFontMode() {
            const fontMode = document.getElementById('fontSelect').value;
            document.body.className = fontMode;
        }

        function updateDiacriticsSize(size) {
            const ipaCols = document.querySelectorAll('.col-ipa');
            const jgstCols = document.querySelectorAll('.col-jgst');
            ipaCols.forEach(col => col.style.fontSize = size + 'rem');
            jgstCols.forEach(col => col.style.fontSize = size + 'rem');
        }

        function toggleDropdownList() {
            document.getElementById('listColToggle').classList.toggle('visible');
        }

        document.addEventListener('click', function(e) {
            const checkList = document.getElementById('listColToggle');
            if (!checkList.contains(e.target)) {
                checkList.classList.remove('visible');
            }
        });

        function updateSectionColspan() {
            const allCols = ['col-latin', 'col-sriwedari', 'col-simplified', 'col-kawi', 'col-tradisional', 'col-unicode', 'col-ipa', 'col-jgst'];
            let visibleCount = 0;
            allCols.forEach(col => {
                const sampleHeader = document.querySelector('th.' + col);
                if (sampleHeader && !sampleHeader.classList.contains('col-hidden')) {
                    visibleCount++;
                }
            });
            const sectionCells = document.querySelectorAll('.section-row-cell');
            sectionCells.forEach(cell => cell.setAttribute('colspan', visibleCount || 1));
        }

        function toggleColumnVisibility(className, show) {
            const elements = document.querySelectorAll('.' + className);
            elements.forEach(el => {
                if (show) el.classList.remove('col-hidden');
                else el.classList.add('col-hidden');
            });
            const chkMap = {
                'col-sriwedari': 'chk_sriwedari',
                'col-simplified': 'chk_simplified',
                'col-kawi': 'chk_kawi',
                'col-tradisional': 'chk_tradisional',
                'col-unicode': 'chk_unicode',
                'col-ipa': 'chk_ipa',
                'col-jgst': 'chk_jgst'
            };
            if (chkMap[className]) {
                const chk = document.getElementById(chkMap[className]);
                if (chk) chk.checked = show;
            }
            updateSectionColspan();
        }

        function applyPresetView(preset) {
            const allCols = ['col-sriwedari', 'col-simplified', 'col-kawi', 'col-tradisional', 'col-unicode', 'col-ipa', 'col-jgst'];
            let visibleCols = [];
            switch (preset) {
                case 'all': visibleCols = [...allCols]; break;
                case 'jawa': visibleCols = ['col-sriwedari', 'col-simplified', 'col-kawi', 'col-tradisional']; break;
                case 'ipa_jgst': visibleCols = ['col-ipa', 'col-jgst']; break;
                case 'jawa_baru': visibleCols = ['col-sriwedari', 'col-simplified']; break;
                case 'jawa_kuno': visibleCols = ['col-kawi', 'col-tradisional']; break;
            }
            allCols.forEach(col => {
                toggleColumnVisibility(col, visibleCols.includes(col));
            });
        }

        function toggleLayoutView(view) {
            currentLayoutView = view;
            const tableView = document.getElementById('tableViewWrapper');
            const gridView = document.getElementById('gridViewWrapper');
            const btnTable = document.getElementById('btnTableView');
            const btnGrid = document.getElementById('btnGridView');

            if (view === 'table') {
                tableView.style.display = 'block';
                gridView.style.display = 'none';
                btnTable.classList.add('btn-primary');
                btnGrid.classList.remove('btn-primary');
            } else {
                tableView.style.display = 'none';
                gridView.style.display = 'grid';
                btnTable.classList.remove('btn-primary');
                btnGrid.classList.add('btn-primary');
            }
            renderData();
        }

        function renderData() {
            const mode = document.getElementById('sortOrder').value;
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            let filteredData = aksaraData.filter(item => {
                return item.lat.toLowerCase().includes(query) ||
                       item.kbj.includes(query) ||
                       item.simp.includes(query) ||
                       item.mk.includes(query) ||
                       item.trad.includes(query) ||
                       item.uni.toLowerCase().includes(query) ||
                       item.ipa.toLowerCase().includes(query) ||
                       item.jgst.toLowerCase().includes(query);
            });

            if (mode === 'alphabet') {
                filteredData.sort((a, b) => a.lat.toLowerCase().localeCompare(b.lat.toLowerCase()));
            } else if (mode === 'hanacaraka') {
                filteredData.sort((a, b) => a.hana - b.hana);
            } else if (mode === 'kawi') {
                filteredData.sort((a, b) => a.warga - b.warga);
            } else if (mode === 'unicode') {
                filteredData.sort((a, b) => extractUnicodeValue(a.uni) - extractUnicodeValue(b.uni));
            }

            if (currentLayoutView === 'table') {
                renderTable(filteredData, mode);
            } else {
                renderGrid(filteredData);
            }
        }

        function renderTable(data, mode) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            let currentCat = '';

            data.forEach(item => {
                if (mode === 'kategori' && item.cat !== currentCat) {
                    currentCat = item.cat;
                    const catRow = document.createElement('tr');
                    catRow.className = 'section-row';
                    catRow.innerHTML = `<td class="section-row-cell">--- KATEGORI ${currentCat.toUpperCase()} ---</td>`;
                    tbody.appendChild(catRow);
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="col-latin"><span class="code" onclick="copyText('${item.lat}')">${item.lat}</span></td>
                    <td class="col-sriwedari">${formatVal(item.kbj)}</td>
                    <td class="col-simplified">${formatVal(item.simp)}</td>
                    <td class="col-kawi">${formatVal(item.mk)}</td>
                    <td class="col-tradisional">${formatVal(item.trad)}</td>
                    <td class="col-unicode"><span class="code" onclick="copyText('${item.uni}')">${item.uni}</span></td>
                    <td class="col-ipa">${item.ipa}</td>
                    <td class="col-jgst">${item.jgst}</td>
                `;
                tbody.appendChild(tr);
            });

            const presetVal = document.getElementById('presetView').value;
            applyPresetView(presetVal);
            updateDiacriticsSize(document.getElementById('diacriticsSize').value);
        }

        function renderGrid(data) {
            const container = document.getElementById('gridViewWrapper');
            container.innerHTML = '';

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'aksara-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-latin">${item.lat}</span>
                        <span class="code" onclick="copyText('${item.uni}')">${item.uni}</span>
                    </div>
                    <div class="card-body">
                        <div class="card-aksara-main col-sriwedari" onclick="copyText('${item.kbj}')" title="Klik untuk salin">${item.kbj}</div>
                        <div class="card-meta">
                            <span class="card-meta-label">Sriwedari/KBJ:</span>
                            <span class="col-sriwedari">${formatVal(item.kbj)}</span>
                        </div>
                        <div class="card-meta">
                            <span class="card-meta-label">Simplified:</span>
                            <span class="col-simplified">${formatVal(item.simp)}</span>
                        </div>
                        <div class="card-meta">
                            <span class="card-meta-label">Tradisional:</span>
                            <span class="col-tradisional">${formatVal(item.trad)}</span>
                        </div>
                        <div class="card-meta">
                            <span class="card-meta-label">Cara Kawi (Mardi Kawi):</span>
                            <span class="col-kawi">${formatVal(item.mk)}</span>
                        </div>
                        <div class="card-meta">
                            <span class="card-meta-label">JGST:</span>
                            <span class="col-jgst">${item.jgst}</span>
                        </div>
                        <div class="card-meta">
                            <span class="card-meta-label">IPA:</span>
                            <span class="col-ipa">${item.ipa}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            updateDiacriticsSize(document.getElementById('diacriticsSize').value);
        }

        // Initial Initialization
        toggleLayoutView('grid');
    </script>
</body>
</html>
